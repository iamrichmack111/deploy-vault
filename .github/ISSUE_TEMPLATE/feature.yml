name: Feature request
description: Propose a focused improvement to the trainer or delivery workflow
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the learner, facilitator, or operator problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Observable requirement"
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Privacy, security, accessibility, and compatibility considerations
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: The proposal preserves safe simulation and does not silently access a real cluster.
          required: true
        - label: The proposal keeps the local account-free workflow available.
          required: true

