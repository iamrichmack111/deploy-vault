<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeployVault Pro</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div class="brand"><span class="logo">DV</span><div><b>DeployVault</b><small>KUBERNETES READINESS SYSTEM</small></div></div><nav><button data-view="dashboard">Dashboard</button><button data-view="lab">Lab</button><button data-view="interview">Interview</button><button data-view="study">Study</button><button data-view="exam">Exam</button></nav><div class="head-stat"><b id="readiness">0%</b><small>READY</small></div></header>
<main><aside><div class="side-title">INCIDENT BANK</div><input id="search" placeholder="Search drills or skills"><div class="filters"><select id="category"><option>All</option></select><select id="difficulty"><option>All</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><button id="randomBtn" class="special">↻ SMART PRACTICE</button><button id="newBtn" class="special secondary">＋ CUSTOM SCENARIO</button><div id="drillList"></div><button id="clearBtn" class="clear">CLEAR SAVED PROGRESS</button></aside><section id="workspace"><div class="loading">Loading incident system…</div></section></main>
<template id="drillTemplate"><div class="hero"><div><div class="eyebrow" id="modeLabel"></div><h1 id="title"></h1><p id="brief"></p><div class="badges"><span id="categoryBadge"></span><span id="difficultyBadge"></span><span id="attemptBadge"></span></div></div><div class="score"><b id="score">100</b><small>SCORE</small></div></div><div class="topology" id="topology"></div><div class="cards"><article><h3>Observed symptoms</h3><ul id="symptoms"></ul></article><article><h3>Mission objectives</h3><ul id="objectives"></ul></article></div>
<div id="labPanel"><div class="terminal"><div class="termbar"><span id="clusterPath"></span><span>↑ history · Tab complete</span><button id="hintBtn">HINT −10</button></div><pre id="output"></pre><div id="suggestions" class="suggestions"></div><form id="commandForm"><span>$</span><input id="command" autocomplete="off" placeholder="kubectl get pods -A"><button>RUN</button></form></div><div class="diagnosis"><h3>Root-cause analysis</h3><textarea id="diagnosis" placeholder="Name the failure, evidence, risk, remediation, and prevention…"></textarea><button id="submitBtn">GRADE RESPONSE</button><div id="rubric"></div><pre id="result"></pre></div></div>
<div id="interviewPanel" hidden><div class="interview"><div class="timer" id="timer">01:30</div><div class="eyebrow">SAY YOUR ANSWER OUT LOUD</div><h2 id="interviewQuestion"></h2><textarea id="spokenAnswer" placeholder="Your spoken or typed answer appears here…"></textarea><div class="row"><button id="micBtn">🎙 START MICROPHONE</button><button id="gradeSpokenBtn">GRADE ANSWER</button><button id="revealBtn" class="secondary">REVEAL −20</button></div><div id="spokenRubric"></div><div id="answer" class="answer" hidden></div></div></div>
<div class="runbook"><h3>Personal runbook notes</h3><textarea id="notes" placeholder="Save commands, reminders, and your own explanation…"></textarea><div class="row"><button id="saveNotes">SAVE NOTES</button><button id="exportNotes" class="secondary">EXPORT RUNBOOK</button></div></div><details><summary>Case study debrief</summary><p id="caseStudy"></p></details></template>
<dialog id="customDialog"><form id="customForm"><h2>Create a custom incident</h2><label>Title<input name="title" required></label><label>Category<input name="category" value="Custom" required></label><label>Brief<textarea name="brief" required></textarea></label><label>Expected diagnosis<textarea name="diagnosis" required></textarea></label><label>Remediation<textarea name="remediation" required></textarea></label><div class="row"><button>ADD SCENARIO</button><button type="button" id="cancelCustom" class="secondary">CANCEL</button></div></form></dialog>
<script src="/app.js"></script></body></html>
